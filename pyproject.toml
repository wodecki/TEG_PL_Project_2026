[project]
name = "decision-copilot"
version = "0.1.0"
description = "Kovalo Decision Copilot – projekt końcowy kursu TEG"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-classic>=1.0,<2",          # LocalFileStore and CacheBackedEmbeddings (the shipped embedding cache)
    "langchain-community>=0.4,<0.5",
    "langchain-core>=1.6,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.2,<2",
    "mcp>=1.10,<2",
    "numpy>=2.0,<3",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
# Optional: Mini-project 2's comparison with a RAG-evaluation framework (uv sync --extra deepeval).
# 4.2.8 is the version verified with the reference LLM (2026-10-06). RAGAS 0.4.3, used before the
# LangChain 1.x migration, doesn't import with langchain-community 0.4 (vibrantlabsai/ragas#2745).
deepeval = ["deepeval==4.2.8"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpers", "mini_project_1", "mini_project_2", "mini_project_3", "mini_project_4", "mini_project_5"]

[tool.pytest.ini_options]
testpaths = ["mini_project_1/tests", "mini_project_2/tests", "mini_project_3/tests", "mini_project_4/tests", "mini_project_5/tests"]
# Temporary (2026-10-06): MP1 step 1 loads the corpus with langchain-community's DirectoryLoader /
# TextLoader. langchain-community 0.4 warns that it is being sunset (its repository is archived);
# it is kept for this course run and to be replaced separately. Only that one warning is hidden.
filterwarnings = ["ignore:`langchain-community` is being sunset:DeprecationWarning"]
